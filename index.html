    <style>
        :root{
            --bg:#0a0806; --gold:#f0a93a; --gold-2:#ffc65c; --line:rgba(240,169,58,.38);
            --red:#d63b3b; --green:#3f9155;
            --text:#f3ece0; --muted:#9c907c;
            --mono:'Share Tech Mono',monospace; --ui:'Rajdhani',sans-serif; --display:'Teko',sans-serif;
        }
        *{box-sizing:border-box}
        html{height:100%; overflow-x:hidden}
        body{
            height:100%; max-width:100%; margin:0; overflow-x:hidden; overflow-y:auto; color:var(--text);
            background:
                radial-gradient(1200px 700px at 50% -10%, rgba(240,169,58,.16), transparent 60%),
                radial-gradient(900px 600px at 88% 112%, rgba(214,59,59,.09), transparent 60%),
                var(--bg);
            font-family:var(--ui); -webkit-font-smoothing:antialiased;
        }
        .grid{position:fixed; inset:0; z-index:1; pointer-events:none;
            background-image:linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
            background-size:46px 46px;
            -webkit-mask-image:radial-gradient(circle at 50% 44%, #000 38%, transparent 78%);
            mask-image:radial-gradient(circle at 50% 44%, #000 38%, transparent 78%);}
        #bg{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0}
        .scanlines{position:fixed; inset:0; z-index:8; pointer-events:none; opacity:.45;
            background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.35) 2px 3px); mix-blend-mode:multiply;}
        .vignette{position:fixed; inset:0; z-index:7; pointer-events:none;
            background:radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0,0,0,.6) 100%);}
        .app{position:relative; z-index:5; min-height:100vh; min-height:100svh; display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:minmax(0,1fr); padding:clamp(16px,2.6vw,36px);}
        .mono{font-family:var(--mono)}
        .hud-top{display:flex; min-width:0; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
        .brand{display:flex; min-width:0; align-items:center; gap:13px}
        .mark{width:clamp(56px,9vw,76px); height:auto; display:block; filter:drop-shadow(0 0 16px rgba(240,169,58,.55))}
        .brand .name{font-family:var(--display); font-weight:700; font-size:1.6rem; letter-spacing:3px; line-height:1; color:#fff}
        /* STAGE */
        .stage{position:relative; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:clamp(18px,3vh,34px); padding:clamp(26px,5vw,64px)}
        .frame{position:absolute; inset:0; pointer-events:none}
        .frame i{position:absolute; width:30px; height:30px; border:2px solid var(--line)}
        .frame i:nth-child(1){top:0; left:0; border-right:0; border-bottom:0}
        .frame i:nth-child(2){top:0; right:0; border-left:0; border-bottom:0}
        .frame i:nth-child(3){bottom:0; left:0; border-right:0; border-top:0}
        .frame i:nth-child(4){bottom:0; right:0; border-left:0; border-top:0}
        .title{
            position:relative; margin:0; max-width:100%; font-family:var(--display); font-weight:700;
            font-size:clamp(1.7rem, calc(11.5vw - 8px), 10.5rem); line-height:.92; letter-spacing:clamp(1px,1.2vw,6px); text-transform:uppercase;
            color:#fff; text-shadow:0 0 36px rgba(240,169,58,.5), 0 16px 46px rgba(0,0,0,.75);
        }
        .title::before, .title::after{
            content:attr(data-text); position:absolute; top:0; left:0; width:100%;
            pointer-events:none; opacity:0;
        }
        .title::before{color:var(--gold); animation:glitchA 3.4s infinite}
        .title::after{color:var(--red); animation:glitchB 2.8s infinite}
        /* DISCORD BUTTON */
        .discord{
            position:relative; display:inline-flex; max-width:100%; align-items:center; gap:13px; margin-top:4px; padding:17px 32px;
            text-decoration:none; color:#1a1206; font-family:var(--ui); font-weight:700; font-size:clamp(1rem,2.4vw,1.2rem);
            letter-spacing:.05em; text-transform:uppercase;
            background:linear-gradient(180deg,var(--gold-2),var(--gold));
            clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);
            box-shadow:0 14px 40px rgba(240,169,58,.35);
            transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
        }
        .discord svg{width:26px; height:26px; fill:#1a1206; flex:none}
        .discord:hover{transform:translateY(-3px); filter:brightness(1.06); box-shadow:0 20px 54px rgba(240,169,58,.5)}
        .discord:active{transform:translateY(0)}
        .discord::after{content:''; position:absolute; inset:0; clip-path:inherit; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); pointer-events:none}
        /* HUD BOTTOM */
        .hud-bottom{display:flex; min-width:0; flex-direction:column; gap:11px}
        .bar{position:relative; height:3px; width:100%; background:rgba(255,255,255,.06); overflow:hidden}
        .bar span{position:absolute; top:0; left:0; height:100%; width:34%; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:scan 3.4s linear infinite}
        /* ANIMATIONS */
        @keyframes scan{0%{transform:translateX(-130%)}100%{transform:translateX(400%)}}
        @keyframes glitchA{
            0%,100%{opacity:0; transform:translate(0,0); clip-path:inset(0 0 0 0)}
            3%{opacity:.85; transform:translate(-3px,-2px); clip-path:inset(0 0 62% 0)}
            7%{opacity:.85; transform:translate(3px,1px); clip-path:inset(56% 0 0 0)}
            11%,54%{opacity:0}
            57%{opacity:.7; transform:translate(2px,-1px); clip-path:inset(22% 0 42% 0)}
            61%{opacity:0}
        }
        @keyframes glitchB{
            0%,100%{opacity:0; transform:translate(0,0); clip-path:inset(0 0 0 0)}
            2%{opacity:.6; transform:translate(3px,2px); clip-path:inset(48% 0 0 0)}
            6%{opacity:.6; transform:translate(-2px,-1px); clip-path:inset(0 0 55% 0)}
            10%,57%{opacity:0}
            60%{opacity:.5; transform:translate(-3px,1px); clip-path:inset(30% 0 30% 0)}
            64%{opacity:0}
        }
        @media (max-width:520px){
            .app{padding:14px}
            .brand{gap:10px}
            .brand .name{font-size:1.3rem; letter-spacing:2px}
            .mark{width:52px}
            .stage{gap:20px; padding:22px 14px}
            .discord{padding:14px 18px; font-size:.92rem; gap:10px; justify-content:center; text-align:center; white-space:normal}
            .discord svg{width:22px; height:22px}
        }
        @media (prefers-reduced-motion: reduce){
            *{animation:none !important}
            .title::before, .title::after{display:none}
        }
    </style>

<body>

    <script>
        /* ---- Háttér: részecske-hálózat ---- */
        (function () {
            const c = document.getElementById('bg');
            const ctx = c.getContext('2d');
            let w = 0, h = 0, pts = [];
            const LINK = 132;

            function build() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = c.clientWidth; h = c.clientHeight;
                c.width = w * dpr; c.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const count = Math.round(Math.min(95, Math.max(26, (w * h) / 20000)));
                pts = Array.from({ length: count }, () => ({
                    x: Math.random() * w, y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.32, vy: (Math.random() - 0.5) * 0.32,
                    r: Math.random() * 1.5 + 0.6
                }));
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < pts.length; i++) {
                    const p = pts[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    for (let j = i + 1; j < pts.length; j++) {
                        const q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
                        if (d2 < LINK * LINK) {
                            const a = (1 - Math.sqrt(d2) / LINK) * 0.17;
                            ctx.strokeStyle = 'rgba(240,169,58,' + a.toFixed(3) + ')';
                            ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
                        }
                    }
                }
                for (const p of pts) {
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(240,169,58,.62)';
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', build);
            build(); draw();
        })();
    </script>
